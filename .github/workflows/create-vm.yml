
name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  
concurrency:
  group: oci-a1-vm-creation
  cancel-in-progress: false
  
env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  SUBNET_ID: ${{ secrets.SUBNET_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
  SUPPRESS_LABEL_WARNING: "True"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI and dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI credentials
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_CLI_KEY_CONTENT" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          tenancy=$OCI_CLI_TENANCY
          fingerprint=$OCI_CLI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          region=$OCI_CLI_REGION
          EOF

          oci iam region list --output table

      - name: Validate OCI resources
        id: validate
        run: |
          set -euo pipefail

          echo "Fetching Availability Domain..."

          AD_NAME=$(oci iam availability-domain list \
            --compartment-id "$OCI_CLI_TENANCY" \
            --query 'data[0].name' \
            --raw-output)

          if [ -z "$AD_NAME" ] || [ "$AD_NAME" = "None" ]; then
            echo "ERROR: No Availability Domain found"
            exit 1
          fi

          echo "Availability Domain: $AD_NAME"

          echo "Fetching Ubuntu 24.04 ARM image..."

          IMAGE_ID=$(oci compute image list \
            --compartment-id "$COMPARTMENT_ID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" \
            --all \
            --query 'data[0].id' \
            --raw-output)

          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "None" ]; then
            echo "ERROR: No compatible ARM image found"
            exit 1
          fi

          echo "Image ID: $IMAGE_ID"

          echo "Validating subnet..."

          SUBNET_JSON=$(oci network subnet get \
            --subnet-id "$SUBNET_ID")

          PROHIBIT_PUBLIC_IP=$(echo "$SUBNET_JSON" | \
            jq -r '.data."prohibit-public-ip-on-vnic"')

          if [ "$PROHIBIT_PUBLIC_IP" = "true" ]; then
            ASSIGN_PUBLIC_IP="false"
          else
            ASSIGN_PUBLIC_IP="true"
          fi

          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: SSH_PUBLIC_KEY secret is missing"
            exit 1
          fi

          {
            echo "AD_NAME=$AD_NAME"
            echo "IMAGE_ID=$IMAGE_ID"
            echo "ASSIGN_PUBLIC_IP=$ASSIGN_PUBLIC_IP"
          } >> "$GITHUB_ENV"

          echo "Validation completed successfully"

      - name: Launch A1 Flex VM
        id: create_vm
        continue-on-error: true
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/oci"

          printf '%s\n' "$SSH_PUBLIC_KEY" \
            > "$RUNNER_TEMP/oci/ssh.pub"

          jq -n \
            --arg image "$IMAGE_ID" \
            '{
              sourceType: "image",
              imageId: $image,
              bootVolumeSizeInGBs: 150
            }' > "$RUNNER_TEMP/oci/source-details.json"

          echo "Launching VM..."

          set +e

          oci --debug compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --source-details "file://$RUNNER_TEMP/oci/source-details.json" \
            --ssh-authorized-keys-file "$RUNNER_TEMP/oci/ssh.pub" \
            --assign-public-ip "$ASSIGN_PUBLIC_IP" \
            --display-name "coolify-vm" \
            --output json \
            > "$RUNNER_TEMP/oci/launch-output.json" \
            2> "$RUNNER_TEMP/oci/launch-error.log"

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "OCI VM launch failed"

            # Keep diagnostics useful without dumping request headers.
            grep -E \
              'CannotParseRequest|ServiceError|status|message|code|operation_name|opc-request-id|Error:' \
              "$RUNNER_TEMP/oci/launch-error.log" \
              | tail -40 || true

            exit "$EXIT_CODE"
          fi

          cat "$RUNNER_TEMP/oci/launch-output.json"

          INSTANCE_ID=$(jq -r '.data.id // empty' \
            "$RUNNER_TEMP/oci/launch-output.json")

          INSTANCE_STATE=$(jq -r '.data."lifecycle-state" // empty' \
            "$RUNNER_TEMP/oci/launch-output.json")

          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: Instance ID missing from OCI response"
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "INSTANCE_STATE=$INSTANCE_STATE" >> "$GITHUB_OUTPUT"

          echo "VM launch accepted!"
          echo "Instance ID: $INSTANCE_ID"
          echo "Instance State: $INSTANCE_STATE"

      
      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "OCI VM Status: ${{ job.status }}"
          status: ${{ job.status == 'success' && 'success' || job.status == 'cancelled' && 'cancelled' || 'failure' }}
          color: ${{ job.status == 'success' && '0x28a745' || '0xdc3545' }}
          description: |
            OCI A1.Flex VM creation attempt.

            Job Status: ${{ job.status }}
            VM Step: ${{ steps.create_vm.outcome }}

            Instance ID: ${{ steps.create_vm.outputs.INSTANCE_ID }}
            Instance State: ${{ steps.create_vm.outputs.INSTANCE_STATE }}

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
